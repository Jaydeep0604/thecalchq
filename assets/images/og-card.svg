<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="25" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Central Emblem Tile -->
  <g filter="url(#cardGlow)">
    <rect x="100" y="165" width="130" height="130" rx="30" fill="#111827" stroke="#242f47" stroke-width="3" />
    <circle cx="140" cy="205" r="16" fill="url(#accent)" />
    <circle cx="140" cy="205" r="7" fill="#111827" />
    <line x1="190" y1="195" x2="140" y2="265" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" />
    <circle cx="190" cy="255" r="16" fill="url(#accent)" />
    <circle cx="190" cy="255" r="7" fill="#111827" />
  </g>

  <!-- Brand Typography -->
  <text x="260" y="235" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="74" fill="#ffffff" letter-spacing="-1">
    Calc<tspan fill="#06b6d4">HQ</tspan>
  </text>
  <text x="260" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#10b981" letter-spacing="4">
    THE CALCULATOR HEADQUARTERS
  </text>

  <!-- Tagline -->
  <text x="100" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="-0.5">
    34 Free Smart &amp; Real-Life Calculators
  </text>
  <text x="100" y="430" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#94a3b8">
    Instant Desk Arithmetic • Mutual Fund SIP • Car EMI • Concrete BBS • Age &amp; DOB • Timesheet
  </text>

  <!-- Feature Badges Pill -->
  <g transform="translate(100, 485)">
    <rect width="210" height="42" rx="21" fill="#1e293b" />
    <text x="25" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#38bdf8">⚡ 100% Client-Side</text>
    
    <rect x="230" width="190" height="42" rx="21" fill="#1e293b" />
    <text x="255" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#34d399">🔒 Zero Data Stored</text>

    <rect x="440" width="190" height="42" rx="21" fill="#1e293b" />
    <text x="465" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#a78bfa">🌐 Multi-Language</text>

    <rect x="650" width="170" height="42" rx="21" fill="#1e293b" />
    <text x="675" y="27" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#f43f5e">🎯 thecalchq.com</text>
  </g>
</svg>

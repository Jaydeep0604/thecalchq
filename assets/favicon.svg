<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1a2234" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)" stroke="#242f47" stroke-width="3" />

  <!-- Percentage / Calculator Emblem -->
  <g filter="url(#glow)">
    <!-- Top-left Circle -->
    <circle cx="42" cy="42" r="14" fill="url(#iconGrad)" />
    <circle cx="42" cy="42" r="6" fill="#0b0f19" />

    <!-- Center Slash -->
    <line x1="86" y1="34" x2="42" y2="94" stroke="url(#iconGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Bottom-right Circle -->
    <circle cx="86" cy="86" r="14" fill="url(#iconGrad)" />
    <circle cx="86" cy="86" r="6" fill="#0b0f19" />
  </g>
</svg>
